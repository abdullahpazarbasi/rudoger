name: rudoger

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.local}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -d master -U sa -P "$$MSSQL_SA_PASSWORD" -C -l 3 -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s
    restart: unless-stopped

  migrate:
    build:
      context: .
    command: ["migrate"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Rudoger: Server=mssql,1433;Database=Rudoger;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
      Jwt__Issuer: ${Jwt__Issuer:-rudoger-api}
      Jwt__Audience: ${Jwt__Audience:-rudoger-clients}
      Jwt__LifetimeMinutes: ${Jwt__LifetimeMinutes:-60}
      Jwt__Secret: ${Jwt__Secret:?Set Jwt__Secret in .env.local}
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
    command: ["seed"]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
    environment: *api-environment
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://localhost:8080/health > /dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  swagger:
    image: docker.swagger.io/swaggerapi/swagger-ui:v5.32.11
    environment:
      BASE_URL: /docs
      URL: /openapi/v1.json
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    volumes:
      - ./docker/swagger-ui/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mssql-data:
